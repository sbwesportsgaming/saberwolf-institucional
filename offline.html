<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SaberWolf Esports | Offline</title>
  <meta name="theme-color" content="#050d14" />

  <style>
    :root {
      color-scheme: light;
      --cyan: #00c8ed;
      --text: #101e2b;
      --muted: #536273;
      --bg: #edf2f5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 28px;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(720px, 100%);
      padding: clamp(28px, 6vw, 54px);
      border: 1px solid #dbe4eb;
      border-top: 3px solid var(--cyan);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 36px rgba(13, 42, 61, 0.06);
    }

    .sbw-offline-logo {
      display: block;
      width: 86px;
      height: 86px;
      margin-bottom: 28px;
      border: 1px solid #dbe4eb;
      border-radius: 8px;
      object-fit: contain;
    }

    .sbw-offline-label {
      display: inline-flex;
      margin-bottom: 14px;
      color: #006d86;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.6;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.12;
      letter-spacing: -0.05em;
    }

    p {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }

    .sbw-offline-actions { display: flex; flex-wrap: wrap; gap: 12px; }

    .sbw-offline-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 12px 22px;
      border: 1px solid var(--cyan);
      border-radius: 5px;
      color: #031820;
      background: var(--cyan);
      font: inherit;
      font-weight: 800;
      line-height: 1.4;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .sbw-offline-button--secondary { color: #006d86; background: #fff; border-color: #84b9c5; }
    .sbw-offline-button:hover { filter: brightness(0.96); }
    .sbw-offline-button:focus-visible { outline: 3px solid #006d86; outline-offset: 4px; }
    .sbw-offline-version { margin: 22px 0 0; color: #607184; font-size: 12px; line-height: 1.6; }

    @media (max-width: 480px) {
      body { padding: 20px; }
      .sbw-offline-actions { flex-direction: column; }
      .sbw-offline-button { width: 100%; }
    }
  </style>
</head>

<body>
  <main aria-labelledby="sbwOfflineTitle">
    <!-- O service worker define a base quando exibe esta tela em outra página. -->
    <img
      class="sbw-offline-logo"
      src="./assets/icons/icon-192-v3.png"
      alt="SaberWolf Esports"
      width="86"
      height="86"
    />

    <span class="sbw-offline-label">
      SaberWolf Esports
    </span>

    <h1 id="sbwOfflineTitle">
      Você está offline
    </h1>

    <p>
      Não foi possível carregar esta página.
      Verifique sua conexão e tente novamente.
      Algumas páginas já visitadas podem continuar disponíveis
      neste dispositivo.
    </p>

    <div class="sbw-offline-actions">
      <button
        class="sbw-offline-button"
        type="button"
        id="sbwOfflineRetry"
      >
        Tentar novamente
      </button>

      <a
        class="sbw-offline-button sbw-offline-button--secondary"
        href="./index.html"
      >
        Voltar ao início
      </a>
    </div>

    <p class="sbw-offline-version">
      Site v1.6.84.3 · App SBW Project
    </p>
  </main>

  <script>
    (function () {
      "use strict";

      const retryButton = document.getElementById("sbwOfflineRetry");

      retryButton.addEventListener("click", function () {
        const offlineUrl = new URL("./offline.html", document.baseURI);

        if (window.location.pathname === offlineUrl.pathname) {
          // Quando este arquivo foi aberto diretamente, tenta acessar o início.
          window.location.assign(
            new URL("./index.html", document.baseURI).href
          );
          return;
        }

        // Quando o service worker exibiu esta tela, tenta a página original.
        window.location.reload();
      });
    })();
  </script>
</body>
</html>
