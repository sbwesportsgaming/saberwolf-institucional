  <script data-sbw-theme-site="esports" data-sbw-theme-offline>/* SBW — preferência de aparência. Executar no head, antes dos estilos. */
(function () {
  "use strict";
  if (window.SBWTheme) return;

  var root = document.documentElement;
  var script = document.currentScript;
  var site = script && script.getAttribute("data-sbw-theme-site") || "project";
  var storageKey = "sbw-theme-v1";
  var allowed = ["light", "dark", "black", "system"];
  var preference = "system";
  var media = typeof window.matchMedia === "function"
    ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  var control = null;
  var fallback = null;
  var sidebarObserver = null;
  var scheduled = false;
  var colors = {
    project: { light: "#f3f4f6", dark: "#11151b", black: "#000000" },
    esports: { light: "#ffffff", dark: "#050d14", black: "#000000" },
    championship: { light: "#dde2e8", dark: "#081321", black: "#000000" }
  };
  if (!Object.prototype.hasOwnProperty.call(colors, site)) site = "project";
  root.setAttribute("data-sbw-theme-site", site);

  function normalize(value) {
    return allowed.indexOf(value) !== -1 ? value : "system";
  }

  try { preference = normalize(window.localStorage.getItem(storageKey)); }
  catch (error) { /* A aparência também funciona com armazenamento bloqueado. */ }

  function resolved() {
    if (preference === "black") return "dark";
    return preference === "system" ? (media && media.matches ? "dark" : "light") : preference;
  }

  function resolvedPalette() {
    return preference === "black" ? "black" : resolved();
  }

  function apply() {
    var theme = resolved();
    var palette = resolvedPalette();
    var previous = root.getAttribute("data-sbw-theme");
    var previousPalette = root.getAttribute("data-sbw-theme-palette");
    root.setAttribute("data-sbw-theme", theme);
    root.setAttribute("data-sbw-theme-palette", palette);
    root.setAttribute("data-sbw-theme-preference", preference);
    root.style.colorScheme = theme;
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
      if (!meta.hasAttribute("media")) meta.content = colors[site][palette];
    });
    document.querySelectorAll("[data-sbw-theme-select]").forEach(function (select) {
      select.value = preference;
    });
    if (previous !== theme || previousPalette !== palette || control) {
      window.dispatchEvent(new CustomEvent("sbw:theme-change", {
        detail: { preference: preference, theme: theme, palette: palette }
      }));
    }
    return theme;
  }

  function setPreference(value) {
    if (allowed.indexOf(value) === -1) return false;
    preference = value;
    try { window.localStorage.setItem(storageKey, value); }
    catch (error) { /* Mantém a escolha durante esta visita. */ }
    apply();
    return true;
  }

  function makeControl() {
    if (control) return control;
    var english = /^en(?:-|$)/i.test(root.lang || "");
    var label = document.createElement("label");
    label.className = "sbw-theme-control";
    label.setAttribute("data-sbw-theme-control", "");
    var icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    icon.setAttribute("viewBox", "0 0 24 24");
    icon.setAttribute("fill", "none");
    icon.setAttribute("stroke", "currentColor");
    icon.setAttribute("stroke-width", "1.7");
    icon.setAttribute("aria-hidden", "true");
    icon.setAttribute("focusable", "false");
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M20.5 13.2A8.8 8.8 0 0 1 10.8 3.5a8.8 8.8 0 1 0 9.7 9.7Z");
    icon.appendChild(path);
    var caption = document.createElement("span");
    caption.className = "sbw-theme-control__caption";
    caption.textContent = english ? "Theme" : "Tema";
    var select = document.createElement("select");
    select.setAttribute("data-sbw-theme-select", "");
    select.setAttribute("aria-label", english ? "Website theme" : "Tema do site");
    var names = english ? ["Light", "Dark", "Black", "Automatic"] : ["Claro", "Escuro", "Preto", "Automático"];
    allowed.forEach(function (value, index) {
      var option = document.createElement("option");
      option.value = value;
      option.textContent = names[index];
      select.appendChild(option);
    });
    select.value = preference;
    select.addEventListener("change", function () { setPreference(select.value); });
    label.appendChild(icon);
    label.appendChild(caption);
    label.appendChild(select);
    control = label;
    return label;
  }

  function mountControl() {
    if (!document.body) return;
    var sidebar = document.querySelector("#sbwChampionshipSidebar, #sbwSidebar");
    var destination = document.querySelector("[data-sbw-theme-mount]");
    if (!destination && sidebar) {
      destination = document.createElement("div");
      destination.className = "sbw-theme-mount sbw-theme-mount--sidebar";
      destination.setAttribute("data-sbw-theme-mount", "");
      var institutional = sidebar.querySelector(".sbw-sidebar__nav--institutional");
      sidebar.insertBefore(destination, institutional || null);
    }
    if (!destination) {
      var nav = document.querySelector(".site-nav, #sbwSiteNavigation, .sbw-error-nav");
      var toolbar = document.querySelector(".hub-topbar, .dlucca-header-inner, .app-header__inner, .sbw-app-header");
      var host = nav || toolbar;
      if (host) {
        destination = document.createElement("div");
        destination.className = "sbw-theme-mount";
        destination.setAttribute("data-sbw-theme-mount", "");
        if (host.id === "sbwSiteNavigation") destination.classList.add("sbw-theme-mount--dark-header");
        if (host.classList.contains("hub-topbar")) {
          host.insertBefore(destination, host.querySelector(".hub-share"));
        } else host.appendChild(destination);
      }
    }
    if (!destination) {
      if (!fallback || !fallback.isConnected) {
        fallback = document.createElement("div");
        fallback.className = "sbw-theme-mount sbw-theme-mount--floating";
        fallback.setAttribute("data-sbw-theme-fallback", "");
        document.body.appendChild(fallback);
      }
      destination = fallback;
    }
    var node = makeControl();
    if (node.parentElement !== destination) destination.appendChild(node);
    if (fallback && fallback !== destination) { fallback.remove(); fallback = null; }
    apply();
  }

  function scheduleMount() {
    if (scheduled) return;
    scheduled = true;
    window.requestAnimationFrame(function () { scheduled = false; mountControl(); });
  }

  function init() {
    mountControl();
    var sidebarMount = document.getElementById("sbwSidebarMount");
    if (sidebarMount && typeof MutationObserver === "function") {
      sidebarObserver = new MutationObserver(function () {
        if (!control || !control.isConnected || (fallback && sidebarMount.querySelector("aside"))) scheduleMount();
      });
      sidebarObserver.observe(sidebarMount, { childList: true, subtree: true });
    }
  }

  if (media) {
    var onSystemChange = function () { if (preference === "system") apply(); };
    if (typeof media.addEventListener === "function") media.addEventListener("change", onSystemChange);
    else if (typeof media.addListener === "function") media.addListener(onSystemChange);
  }
  window.addEventListener("storage", function (event) {
    if (event.key === storageKey || event.key === null) {
      preference = normalize(event.key === null ? null : event.newValue);
      apply();
    }
  });
  window.addEventListener("pageshow", apply);
  window.SBWTheme = {
    getPreference: function () { return preference; },
    getResolvedTheme: resolved,
    getResolvedPalette: resolvedPalette,
    setPreference: setPreference,
    refresh: mountControl
  };
  apply();
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init, { once: true });
  else init();
})();
</script>

  <title>SaberWolf Esports | Offline</title>
  <meta name="theme-color" content="#050d14" />

  <style>
    :root {
      color-scheme: light;
      --cyan: #00c8ed;
      --text: #101e2b;
      --muted: #536273;
      --bg: #edf2f5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 28px;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(720px, 100%);
      padding: clamp(28px, 6vw, 54px);
      border: 1px solid #dbe4eb;
      border-top: 3px solid var(--cyan);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 36px rgba(13, 42, 61, 0.06);
    }

    .sbw-offline-logo {
      display: block;
      width: 86px;
      height: 86px;
      margin-bottom: 28px;
      border: 1px solid #dbe4eb;
      border-radius: 8px;
      object-fit: contain;
    }

    .sbw-offline-label {
      display: inline-flex;
      margin-bottom: 14px;
      color: #006d86;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.6;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.12;
      letter-spacing: -0.05em;
    }

    p {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }

    .sbw-offline-actions { display: flex; flex-wrap: wrap; gap: 12px; }

    .sbw-offline-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 12px 22px;
      border: 1px solid var(--cyan);
      border-radius: 5px;
      color: #031820;
      background: var(--cyan);
      font: inherit;
      font-weight: 800;
      line-height: 1.4;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .sbw-offline-button--secondary { color: #006d86; background: #fff; border-color: #84b9c5; }
    .sbw-offline-button:hover { filter: brightness(0.96); }
    .sbw-offline-button:focus-visible { outline: 3px solid #006d86; outline-offset: 4px; }
    .sbw-offline-version { margin: 22px 0 0; color: #607184; font-size: 12px; line-height: 1.6; }

    @media (max-width: 480px) {
      body { padding: 20px; }
      .sbw-offline-actions { flex-direction: column; }
      .sbw-offline-button { width: 100%; }
    }
  </style>

  --hub-accent: #096d96;
  --hub-card: #fff;
  --hub-border: #b9c8d4;
  background: var(--hub-bg);
  color: var(--hub-text);
}
html[data-sbw-theme="light"] .sbw-hub .hub-art { background: linear-gradient(145deg, #f4f7f9, #e5edf3); }
html[data-sbw-theme="light"] .sbw-hub .hub-art::before,
html[data-sbw-theme="light"] .sbw-hub .hub-art::after { opacity: .1; }
html[data-sbw-theme="light"] .sbw-hub .hub-card { color: #142639; background: #fff; border-color: #b9c8d4; }
html[data-sbw-theme="light"] .sbw-hub :is(.hub-card--featured, .hub-card--discord) { color: #fff; background: #096eaa; border-color: #096eaa; }
html[data-sbw-theme="light"] .sbw-hub :is(.hub-card--featured, .hub-card--discord) small { color: #eef6ff; }
html[data-sbw-theme="light"] .sbw-hub :is(.hub-share, .hub-copy-button, .hub-copy-panel) { color: #142639; background: #fff; border-color: #b9c8d4; }
/* A tela offline permanece legível nos dois modos. */
html[data-sbw-theme="light"][data-sbw-theme-page="offline"] body { color: var(--sbw-theme-text); background: var(--sbw-theme-page); }
html[data-sbw-theme="light"][data-sbw-theme-page="offline"] main { background: var(--sbw-theme-panel); border-color: var(--sbw-theme-border); }
html[data-sbw-theme="light"][data-sbw-theme-page="offline"] h1 { color: var(--sbw-theme-text); }
html[data-sbw-theme="light"][data-sbw-theme-page="offline"] p { color: var(--sbw-theme-muted); }
html[data-sbw-theme="light"][data-sbw-theme-page="offline"] .sbw-offline-button--secondary { color: var(--sbw-theme-text); background: var(--sbw-theme-soft); border-color: var(--sbw-theme-border); }

  </style>
</head>

<body>
  <main aria-labelledby="sbwOfflineTitle">
    <!-- O service worker define a base quando exibe esta tela em outra página. -->
    <img
      class="sbw-offline-logo"
      src="./assets/icons/icon-192-v3.png"
      alt="SaberWolf Esports"
      width="86"
      height="86"
    />

    <span class="sbw-offline-label">
      SaberWolf Esports
    </span>

    <h1 id="sbwOfflineTitle">
      Você está offline
    </h1>

    <p>
      Não foi possível carregar esta página.
      Verifique sua conexão e tente novamente.
      Algumas páginas já visitadas podem continuar disponíveis
      neste dispositivo.
    </p>

    <div class="sbw-offline-actions">
      <button
        class="sbw-offline-button"
        type="button"
        id="sbwOfflineRetry"
      >
        Tentar novamente
      </button>

      <a
        class="sbw-offline-button sbw-offline-button--secondary"
        href="./index.html"
      >
        Voltar ao início
      </a>
    </div>

    <p class="sbw-offline-version">
      Site v1.6.84.3 · App SBW Project
    </p>
  </main>

  <script>
    (function () {
      "use strict";

      const retryButton = document.getElementById("sbwOfflineRetry");

      retryButton.addEventListener("click", function () {
        const offlineUrl = new URL("./offline.html", document.baseURI);

        if (window.location.pathname === offlineUrl.pathname) {
          // Quando este arquivo foi aberto diretamente, tenta acessar o início.
          window.location.assign(
            new URL("./index.html", document.baseURI).href
          );
          return;
        }

        // Quando o service worker exibiu esta tela, tenta a página original.
        window.location.reload();
      });
    })();
  </script>
</body>
</html>
